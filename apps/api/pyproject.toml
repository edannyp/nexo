[project]
name = "nexo-api"
version = "0.5.0"
description = "API de Nexo (FastAPI) y migraciones de la base nexo"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "clickhouse-connect>=0.8",
  "boto3>=1.35",
  "pillow>=13.0.0",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]   # SQL de las pruebas en una línea

[tool.ruff.lint.isort]
known-third-party = ["alembic"]   # la carpeta alembic/ del proyecto no es el paquete
