[project]
name = "nexo-api"
version = "0.1.0"
description = "API de la APP de Integración (FastAPI) y migraciones de Nexo"
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
