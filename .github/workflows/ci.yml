name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API y bases (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PRUEBAS_PG_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependencias
        working-directory: apps/api
        run: uv sync --frozen
      - name: Lint
        working-directory: apps/api
        run: uv run ruff check src alembic tests
      - name: Pruebas de la API y la base nexo
        working-directory: apps/api
        run: uv run pytest
      - name: Contrato de Consolidación y MercadoExterno
        run: uv run db/pruebas/probar.py --host localhost
      - name: El cliente generado está al día con la API
        working-directory: apps/api
        run: |
          uv run python -m nexo_api.openapi ../../packages/api-client/openapi.json
          git diff --exit-code -- ../../packages/api-client/openapi.json

  web:
    name: Consola web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @nexo/web lint
      - name: Pruebas
        run: pnpm --filter @nexo/web test
      - name: Compilación
        run: pnpm --filter @nexo/web build
